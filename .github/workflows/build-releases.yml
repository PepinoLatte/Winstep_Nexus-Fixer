name: Build Multi-Architecture Windows Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WinstepFixer-Windows-x64
            os: windows-latest
            python-version: '3.12'
            architecture: 'x64'
            description: 'Windows 10 / 11 64-bit 现代系统推荐版'

          - name: WinstepFixer-Windows-x86
            os: windows-latest
            python-version: '3.12'
            architecture: 'x86'
            description: 'Windows 10 / 11 32-bit 及跨架构通用兼容版'

          - name: WinstepFixer-Legacy-Win7-Win8-x86
            os: windows-latest
            python-version: '3.8'
            architecture: 'x86'
            description: 'Windows 7 / 8 / 8.1 / 10 / 11 全系老旧电脑终极兼容版'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} (${{ matrix.architecture }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python -m PyInstaller --onefile --windowed --name "${{ matrix.name }}" --add-data "Languages;Languages" --clean main.py

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $distExe = "dist/${{ matrix.name }}.exe"
          if (!(Test-Path $distExe)) {
            Write-Error "Build artifact $distExe not found!"
            exit 1
          }
          Compress-Archive -Path $distExe, "README.md", "LICENSE" -DestinationPath "${{ matrix.name }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Release Notes & Checksums
        id: prepare_release
        run: |
          echo "### 📦 Release Assets / 发行版说明" > release_notes.md
          echo "" >> release_notes.md
          echo "| 文件名称 | 适用操作系统环境 | 架构 | 说明 |" >> release_notes.md
          echo "|---|---|---|---|" >> release_notes.md
          echo "| **WinstepFixer-Windows-x64.zip** | Windows 10 / 11 | 64 位 (x64) | 现代 64 位电脑推荐版，支持 Per-Monitor V2 DPI 高清自适应 |" >> release_notes.md
          echo "| **WinstepFixer-Windows-x86.zip** | Windows 10 / 11 | 32 位 (x86) | 32 位系统原生运行，亦可在 64 位系统运行 |" >> release_notes.md
          echo "| **WinstepFixer-Legacy-Win7-Win8-x86.zip** | Windows 7 / 8 / 8.1 / 10 / 11 | 32 位 (x86) | 基于 Python 3.8 x86 构建，完美兼容 Windows 7 SP1 及老旧电脑 |" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔒 SHA256 Checksums" >> release_notes.md
          echo '```text' >> release_notes.md
          cd release_assets && sha256sum *.zip >> ../release_notes.md && cd ..
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release_assets/*.zip
          draft: false
          prerelease: false
