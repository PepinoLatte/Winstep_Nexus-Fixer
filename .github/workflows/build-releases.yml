name: Build Multi-Architecture Windows Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WinstepFixer-x64-Win10-Win11
            target-suffix: x64-Win10-Win11
            os: windows-latest
            python-version: '3.12'
            architecture: 'x64'
            description: 'Windows 10 / 11 64-bit 现代系统推荐版'

          - name: WinstepFixer-x86-Win10-Win11
            target-suffix: x86-Win10-Win11
            os: windows-latest
            python-version: '3.12'
            architecture: 'x86'
            description: 'Windows 10 / 11 32-bit 及跨架构通用兼容版'

          - name: WinstepFixer-x86-Win7-Win8-Legacy
            target-suffix: x86-Win7-Win8-Legacy
            os: windows-latest
            python-version: '3.8'
            architecture: 'x86'
            description: 'Windows 7 / 8 / 8.1 / 10 / 11 全系老旧电脑终极兼容版'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} (${{ matrix.architecture }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python -m PyInstaller --onefile --windowed --name "${{ matrix.name }}" --add-data "Languages;Languages" --clean main.py

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $distExe = "dist/${{ matrix.name }}.exe"
          if (!(Test-Path $distExe)) {
            Write-Error "Build artifact $distExe not found!"
            exit 1
          }
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "WinstepFixer-$tag-${{ matrix.target-suffix }}.zip"
          Compress-Archive -Path $distExe, "README.md", "LICENSE" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Release Notes & Checksums
        id: prepare_release
        run: |
          echo "## Winstep Nexus 中文与乱码深度修复工具 ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "专为解决 Winstep Nexus 与 Winstep Xtreme 在中文 Windows 系统下的托盘乱码、多国语言包冲突、首选项标签缺失及高分辨率缩放问题而构建的通用自动化补丁工具。" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 资源文件下载与推荐指引" >> release_notes.md
          echo "" >> release_notes.md
          echo "根据您的操作系统与硬件架构，直接下载对应 ZIP 文件（解压后双击运行即可）：" >> release_notes.md
          echo "" >> release_notes.md
          echo "| 推荐顺序 | 文件名称 | 适用操作系统 | 架构 | 说明 |" >> release_notes.md
          echo "| :---: | :--- | :--- | :--- | :--- |" >> release_notes.md
          echo "| **主流推荐** | **\`WinstepFixer-${{ github.ref_name }}-x64-Win10-Win11.zip\`** | Windows 10 / Windows 11 | 64 位 (x64) | **95% 现代电脑首选**。支持 Per-Monitor V2 矢量 DPI 高清自适应 |" >> release_notes.md
          echo "| **次选兼容** | **\`WinstepFixer-${{ github.ref_name }}-x86-Win10-Win11.zip\`** | Windows 10 / Windows 11 | 32 位 (x86) | 适用于 32 位 Windows 10/11，或在 64 位系统上以 32 位原生模式运行 |" >> release_notes.md
          echo "| **老机专用** | **\`WinstepFixer-${{ github.ref_name }}-x86-Win7-Win8-Legacy.zip\`** | Windows 7 SP1 / 8 / 8.1 / 10 / 11 | 32 位 (x86) | 针对老旧系统的终极兼容版，基于支持 Win7 的 Python 3.8 x86 运行时构建 |" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### SHA256 Checksums" >> release_notes.md
          echo '```text' >> release_notes.md
          cd release_assets && sha256sum *.zip >> ../release_notes.md && cd ..
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: release_assets/*.zip
          draft: false
          prerelease: false
